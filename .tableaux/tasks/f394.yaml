  - { url: https://github.com/nbyoung/tableaux/blob/main/.tableaux/tasks/c545.yaml, text: "The contextual tableau in Markdown" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/.tableaux/tasks/69eb.yaml, text: "The contextual tableau in HTML, the disclosure" }
requires:
