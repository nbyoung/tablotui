  - { url: https://github.com/nbyoung/tableaux/blob/main/.tableaux/tasks/ab8e.yaml, text: "The global tableau in Markdown, the terminal layout" }
  - { url: https://github.com/nbyoung/tableaux/blob/main/.tableaux/tasks/32e7.yaml, text: "The global tableau in HTML, the column disclosure" }
  - { url: README.md#what-it-does, text: "The grid, gate window and hidden columns" }
requires:
